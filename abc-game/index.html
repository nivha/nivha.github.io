<!DOCTYPE html> <html lang="he" dir="rtl"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <title>משחק ה-ABC של הצמחים</title> <style> :root{ --ink:#294437; --green:#2f9e63; --green2:#56c27e; --soft:#ecfff0; --soft2:#d8f5df; --bg1:#f5fff3; --bg2:#dff4ea; --shadow:0 12px 30px rgba(52,98,68,.18); } *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{ margin:0; width:100%; height:100%; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; color:var(--ink); background: radial-gradient(circle at 10% 10%, rgba(255,243,176,.9) 0 7%, transparent 8%), radial-gradient(circle at 90% 12%, rgba(186,240,194,.95) 0 8%, transparent 9%), radial-gradient(circle at 85% 88%, rgba(223,247,221,.95) 0 9%, transparent 10%), linear-gradient(180deg,var(--bg1) 0%, #e9faef 45%, var(--bg2) 100%); } body{ padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); } .app{ width:min(860px,100%); height:calc(100dvh - 16px); margin:0 auto; display:grid; grid-template-rows:auto auto auto auto 1fr auto; gap:8px; } .card{ background:rgba(255,255,255,.88); border:2px solid rgba(255,255,255,.96); border-radius:24px; box-shadow:var(--shadow); backdrop-filter:blur(10px); } header{ text-align:center; padding:10px 14px; background:linear-gradient(135deg,#ffffff, #edfce8 40%, #dbf6e4 100%); position:relative; overflow:hidden; } header::before, header::after{ position:absolute; font-size:26px; opacity:.95; } header::before{content:"🌿";top:6px;left:10px} header::after{content:"🌸";top:8px;right:12px} h1{ margin:0; font-size:clamp(1.25rem,4.5vw,1.95rem); line-height:1.1; } .subtitle{ margin-top:4px; font-size:clamp(.8rem,2.5vw,.98rem); opacity:.82; font-weight:700; } .status{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:8px; } .box{ background:linear-gradient(180deg,#fff,#f5fff7); border-radius:18px; text-align:center; padding:10px 8px; box-shadow:0 5px 12px rgba(0,0,0,.05); font-weight:900; border:1px solid #e5f5e8; } .box .small{ display:block; margin-bottom:3px; font-size:.78rem; opacity:.72; font-weight:700; } .new-letter-card{ padding:8px; background:linear-gradient(135deg,#f7fff8,#ecfff0); } .new-letter-btn{ width:100%; border:0; border-radius:24px; padding:8px; font:inherit; cursor:pointer; color:var(--ink); background:linear-gradient(180deg,#ffffff,#e9fff0); box-shadow:0 6px 14px rgba(0,0,0,.08); border:2px solid #d7f1de; display:block; } .new-letter-big{ min-height:108px; border-radius:22px; display:grid; place-items:center; background:linear-gradient(180deg,#ffffff,#f4fff6); border:2px solid #dff3e3; box-shadow:inset 0 0 0 1px rgba(255,255,255,.8); font-size:clamp(4rem,16vw,6.5rem); font-weight:900; line-height:1; color:#216043; letter-spacing:.03em; } .divider-strip{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:2px 6px 0; } .divider-line{ height:2px; border-radius:999px; background:linear-gradient(90deg, transparent, #cfe8d5, transparent); } .divider-decor{ font-size:clamp(1rem,3vw,1.25rem); letter-spacing:4px; opacity:.85; white-space:nowrap; } .board-wrap{ min-height:0; overflow:hidden; display:grid; place-items:center; padding:8px; background: radial-gradient(circle at 18% 18%, rgba(223,247,221,.8) 0 10%, transparent 11%), radial-gradient(circle at 85% 22%, rgba(186,240,194,.75) 0 11%, transparent 12%), radial-gradient(circle at 22% 78%, rgba(255,231,240,.65) 0 9%, transparent 10%), linear-gradient(180deg,#fff, #f7fff9); } .board{ width:fit-content; max-width:100%; display:grid; align-content:center; justify-content:center; direction:ltr; margin:auto; } .letter{ width:100%; height:100%; min-width:0; min-height:0; border:0; border-radius:20px; background:linear-gradient(180deg,#ffffff,#f2fff4); color:#2f684a; box-shadow: 0 7px 0 rgba(78,168,108,.28), 0 12px 18px rgba(52,98,68,.12); font-size:clamp(1.35rem,5vw,2.5rem); font-weight:900; cursor:pointer; user-select:none; touch-action:manipulation; transition:transform .12s ease, box-shadow .12s ease, background .2s ease, opacity .2s ease; } .letter:active{ transform:translateY(4px) scale(.98); box-shadow: 0 2px 0 rgba(78,168,108,.25), 0 5px 10px rgba(52,98,68,.10); } .letter.done{ background:linear-gradient(180deg,#dcfff0,#c8ffe8); color:#167b58; opacity:.92; box-shadow: 0 4px 0 rgba(78,194,140,.25), 0 8px 12px rgba(78,194,140,.10); pointer-events:none; } .letter.wrong{ animation:shake .28s linear; background:linear-gradient(180deg,#ffe8ef,#ffd3df); color:#b23658; } .letter.hinting{ position:relative; z-index:2; animation:pulse 1s ease-in-out 3; background:linear-gradient(180deg,#fff8d5,#fff0a7); outline:4px solid rgba(255,205,82,.45); } .buttons{ display:grid; grid-template-columns:1fr 1fr; gap:8px; } .action{ width:100%; border:0; border-radius:20px; padding:13px 8px; font:inherit; font-size:clamp(.92rem,2.8vw,1.06rem); font-weight:900; cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.08); } .hint-button{ background:linear-gradient(180deg,#fff7cb,#ffeaa2); color:#8c5c00; } .reset-button{ background:linear-gradient(180deg,#e8ffe9,#c9f5cf); color:#266745; } .overlay{ position:fixed; inset:0; z-index:25; display:none; place-items:center; padding:18px; background:rgba(38,82,58,.28); backdrop-filter:blur(6px); } .overlay.show{display:grid} .modal{ width:min(450px,100%); padding:24px 18px; border-radius:30px; background:linear-gradient(180deg,#fff, #f6fff8 60%, #edf9f2); box-shadow:0 24px 70px rgba(30,41,59,.25); text-align:center; border:2px solid #fff; } .modal .big-guide{ font-size:56px; margin-bottom:6px; } .modal h2{ margin:0 0 8px; font-size:clamp(1.75rem,8vw,2.9rem); color:#2f7a52; } .modal p{ margin:0 0 18px; font-size:1rem; font-weight:700; line-height:1.5; } .modal button{ width:100%; border:0; border-radius:18px; padding:14px; font:inherit; font-weight:900; cursor:pointer; } .continue-button{ background:linear-gradient(180deg,#56c27e,#2f9e63); color:#fff; } .confirm-buttons{ display:grid; grid-template-columns:1fr 1fr; gap:8px; } .no-button{ background:#ecf5ef; color:var(--ink); } .yes-button{ background:#2f9e63; color:#fff; } .celebration{ position:fixed; inset:0; z-index:15; overflow:hidden; pointer-events:none; } .confetti{ position:absolute; top:-30px; font-size:24px; animation:fall 1.9s linear forwards; } @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} } @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} } @keyframes fall{ to{ transform:translateY(110vh) rotate(600deg); opacity:.9; } } @media (max-width:720px){ .new-letter-big{ min-height:92px; } } @media (max-width:560px){ .app{ height:calc(100dvh - 12px); gap:6px; } .card{border-radius:18px} header{padding:8px 10px} .status{padding:6px;gap:6px} .box{padding:8px 4px} .board-wrap{padding:6px} .letter{border-radius:15px} .action{padding:11px 5px} } @media (max-height:700px){ .subtitle{display:none} header{padding-block:6px} .board{gap:5px} .action{padding:9px 5px} .new-letter-big{min-height:76px;font-size:clamp(3.1rem,12vw,4.8rem)} } </style> </head> <body> <main class="app"> <header class="card"> <h1>🌿 משחק ה־ABC של הצמחים</h1> <div class="subtitle">פרחים, עצים, עלים וצמחים</div> </header> <section class="card status"> <div class="box"> <span class="small">שלב</span> <span id="levelBox">1</span> </div> <div class="box"> <span class="small">רמזים</span> <span id="hintCount">0</span> </div> <div class="box"> <span class="small">טעויות</span> <span id="wrongCount">0</span> </div> </section> <section class="card new-letter-card"> <button id="newLetterBtn" class="new-letter-btn" type="button" aria-label="האות החדשה של השלב"> <div class="new-letter-big" id="newLetterText">A</div> </button> </section> <section class="divider-strip" aria-hidden="true"> <div class="divider-line"></div> <div class="divider-decor">🌿 🌸 🍃 🌱 🌼</div> <div class="divider-line"></div> </section> <section class="card board-wrap"> <div id="board" class="board" aria-label="לוח אותיות"></div> </section> <div class="buttons"> <button id="hintBtn" class="action hint-button" type="button">💡 רמז מהג׳ונגל</button> <button id="resetBtn" class="action reset-button" type="button">↩️ להתחיל מההתחלה</button> </div> </main> <div id="celebration" class="celebration" aria-hidden="true"></div> <div id="resultOverlay" class="overlay" role="dialog" aria-modal="true"> <div class="modal"> <div class="big-guide">🪴</div> <h2 id="resultTitle">כל הכבוד! 🎉</h2> <p id="resultText"></p> <button id="nextBtn" class="continue-button" type="button">המשך</button> </div> </div> <div id="resetOverlay" class="overlay" role="dialog" aria-modal="true"> <div class="modal"> <div class="big-guide">🌸</div> <h2>להתחיל מההתחלה?</h2> <p>אם תלחצי כן, נחזור לשלב הראשון שבו יש רק את האות A.</p> <div class="confirm-buttons"> <button id="cancelResetBtn" class="no-button" type="button">לא</button> <button id="confirmResetBtn" class="yes-button" type="button">כן</button> </div> </div> </div> <script> (() => { const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""); const boardWrap = document.querySelector(".board-wrap"); const board = document.getElementById("board"); const levelBox = document.getElementById("levelBox"); const hintCountEl = document.getElementById("hintCount"); const wrongCountEl = document.getElementById("wrongCount"); const newLetterText = document.getElementById("newLetterText"); const newLetterBtn = document.getElementById("newLetterBtn"); const hintBtn = document.getElementById("hintBtn"); const resetBtn = document.getElementById("resetBtn"); const resultOverlay = document.getElementById("resultOverlay"); const resultTitle = document.getElementById("resultTitle"); const resultText = document.getElementById("resultText"); const nextBtn = document.getElementById("nextBtn"); const resetOverlay = document.getElementById("resetOverlay"); const cancelResetBtn = document.getElementById("cancelResetBtn"); const confirmResetBtn = document.getElementById("confirmResetBtn"); const celebration = document.getElementById("celebration"); let stageSize = Number(localStorage.getItem("abc-share-plants-visible") || 1); stageSize = Math.max(1, Math.min(stageSize, 26)); let expectedIndex = 0; let hintClicks = 0; let wrongClicks = 0; let hintStage = 0; let inactivityTimer = null; let boardPassed = false; let preferredVoice = null; let activeUtterance = null; function resolveVoice() { if (!("speechSynthesis" in window)) return; const voices = window.speechSynthesis.getVoices(); preferredVoice = voices.find(voice => voice.lang && voice.lang.toLowerCase() === "en-us") || voices.find(voice => voice.lang && voice.lang.toLowerCase().startsWith("en")) || null; } function makeUtterance(letter) { const utterance = new SpeechSynthesisUtterance(letter); utterance.lang = "en-US"; utterance.rate = 0.7; utterance.pitch = 1; utterance.volume = 1; if (preferredVoice) utterance.voice = preferredVoice; return utterance; } function speakLetter(letter) { if (!("speechSynthesis" in window)) return; const synth = window.speechSynthesis; if (synth.paused) synth.resume(); synth.cancel(); const utterance = makeUtterance(letter); activeUtterance = utterance; utterance.onend = utterance.onerror = () => { if (activeUtterance === utterance) activeUtterance = null; }; synth.speak(utterance); } function currentLetters() { return alphabet.slice(0, stageSize); } function newestLetter() { return alphabet[stageSize - 1]; } function updateNewLetterCard() { newLetterText.textContent = newestLetter(); } function shuffle(items) { const arr = [...items]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; } function columnsFor(total) { if (total <= 4) return 2; if (total <= 9) return 3; if (total <= 16) return 4; if (total <= 25) return 5; return 6; } function jungleSay(text) { } function resetBoardState() { expectedIndex = 0; hintClicks = 0; wrongClicks = 0; hintStage = 0; boardPassed = false; hintCountEl.textContent = "0"; wrongCountEl.textContent = "0"; levelBox.textContent = String(stageSize); updateNewLetterCard(); resultOverlay.classList.remove("show"); resetOverlay.classList.remove("show"); renderBoard(); updateStartMessage(); resetIdleHint(); } function sizeBoard() { const total = currentLetters().length; const cols = columnsFor(total); const rows = Math.ceil(total / cols); const gap = window.innerHeight < 700 ? 5 : 8; const wrapStyle = getComputedStyle(boardWrap); const padX = parseFloat(wrapStyle.paddingLeft) + parseFloat(wrapStyle.paddingRight); const padY = parseFloat(wrapStyle.paddingTop) + parseFloat(wrapStyle.paddingBottom); const availableWidth = Math.max(0, boardWrap.clientWidth - padX); const availableHeight = Math.max(0, boardWrap.clientHeight - padY); const byWidth = (availableWidth - gap * (cols - 1)) / cols; const byHeight = (availableHeight - gap * (rows - 1)) / rows; let cellSize = Math.floor(Math.min(byWidth, byHeight, 150)); if (!Number.isFinite(cellSize) || cellSize <= 0) return; cellSize = Math.max(28, cellSize); board.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`; board.style.gridAutoRows = `${cellSize}px`; board.style.gap = `${gap}px`; board.querySelectorAll(".letter").forEach(button => { button.style.fontSize = `${Math.max(24, Math.min(50, cellSize * 0.34))}px`; }); } function renderBoard() { const letters = currentLetters(); board.innerHTML = ""; shuffle(letters).forEach(letter => { const button = document.createElement("button"); button.type = "button"; button.className = "letter"; button.textContent = letter; button.dataset.letter = letter; button.addEventListener("pointerdown", () => speakLetter(letter)); button.addEventListener("click", () => choose(button, letter)); board.appendChild(button); }); sizeBoard(); requestAnimationFrame(sizeBoard); } function updateStartMessage() { if (stageSize === 1) { jungleSay("היי! אני צמח הג׳ונגל. לחצי על A כדי להתחיל 🌱"); } else { jungleSay("קדימה! איזו אות מתחילה את ה־ABC? 🍃"); } } function choose(button, letter) { const letters = currentLetters(); const wanted = letters[expectedIndex]; clearTimeout(inactivityTimer); if (letter === wanted) { button.classList.remove("hinting"); button.classList.add("done"); expectedIndex++; hintStage = 0; if (expectedIndex === letters.length) { jungleSay("יופי! סיימת את כל הלוח! 🌴"); setTimeout(finishBoard, 300); return; } const previous = letters[expectedIndex - 1]; jungleSay(`כל הכבוד! מה בא אחרי ${previous}? 🌿`); resetIdleHint(); return; } wrongClicks++; wrongCountEl.textContent = String(wrongClicks); button.classList.remove("wrong"); void button.offsetWidth; button.classList.add("wrong"); jungleSay("אופס, זו לא האות הנכונה. נסי שוב 🍃"); setTimeout(() => { button.classList.remove("wrong"); }, 320); resetIdleHint(); } function showHint() { const letters = currentLetters(); if (expectedIndex >= letters.length) return; hintClicks++; hintCountEl.textContent = String(hintClicks); const wanted = letters[expectedIndex]; if (hintStage === 0) { if (expectedIndex === 0) { jungleSay("רמז מהג׳ונגל: ה־ABC מתחיל באות A 🌱"); } else { const previous = letters[expectedIndex - 1]; jungleSay(`רמז: מה בא אחרי ${previous}? 🌿`); } hintStage = 1; resetIdleHint(); return; } const button = [...board.children].find(item => item.dataset.letter === wanted); if (!button) return; button.classList.remove("hinting"); void button.offsetWidth; button.classList.add("hinting"); jungleSay("אני מראה לך את האות הנכונה עכשיו 💡🍃"); hintStage = 2; setTimeout(() => { button.classList.remove("hinting"); }, 3000); resetIdleHint(); } function finishBoard() { clearTimeout(inactivityTimer); const perfect = hintClicks === 0 && wrongClicks === 0; boardPassed = perfect; if (perfect) { confetti(); if (stageSize < 26) { resultTitle.textContent = "כל הכבוד! 🎉"; resultText.textContent = `סיימת את שלב ${stageSize} בלי רמזים ובלי טעויות. הצמחים גאים בך! עכשיו עוברים לשלב ${stageSize + 1}.`; nextBtn.textContent = "לשלב הבא"; } else { resultTitle.textContent = "אלופה! 🏆"; resultText.textContent = "סיימת את כל האותיות מ־A עד Z בלי רמזים ובלי טעויות. כל הצמחים גאים בך!"; nextBtn.textContent = "לשחק שוב"; } } else { resultTitle.textContent = "ננסה שוב 😊"; resultText.textContent = `בלוח הזה היו ${hintClicks} רמזים ו־${wrongClicks} טעויות. כדי לעבור שלב צריך לסיים בלי רמזים ובלי טעויות.`; nextBtn.textContent = "לנסות שוב"; } resultOverlay.classList.add("show"); } function continueAfterBoard() { resultOverlay.classList.remove("show"); if (boardPassed) { stageSize = stageSize < 26 ? stageSize + 1 : 1; localStorage.setItem("abc-share-plants-visible", String(stageSize)); } resetBoardState(); } function resetIdleHint() { clearTimeout(inactivityTimer); inactivityTimer = setTimeout(() => { const letters = currentLetters(); if (expectedIndex >= letters.length) return; if (expectedIndex === 0) { jungleSay("נתקעת? אפשר ללחוץ על רמז מהג׳ונגל 💡"); } else { const previous = letters[expectedIndex - 1]; jungleSay(`נתקעת? מה בא אחרי ${previous}? 🌿`); } hintStage = Math.max(hintStage, 1); }, 7000); } function confetti() { celebration.innerHTML = ""; const symbols = ["⭐","🌿","🍃","🌱","🌸","🌼","🌺","🪴","🌴","🌳","🎉"]; for (let i = 0; i < 26; i++) { const piece = document.createElement("span"); piece.className = "confetti"; piece.textContent = symbols[Math.floor(Math.random() * symbols.length)]; piece.style.left = Math.random() * 100 + "vw"; piece.style.animationDelay = Math.random() * .5 + "s"; piece.style.animationDuration = (1.3 + Math.random() * 1.2) + "s"; celebration.appendChild(piece); } setTimeout(() => { celebration.innerHTML = ""; }, 2900); } hintBtn.addEventListener("click", showHint); newLetterBtn.addEventListener("pointerdown", () => { speakLetter(newestLetter()); }); newLetterBtn.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") speakLetter(newestLetter()); }); resetBtn.addEventListener("click", () => { resetOverlay.classList.add("show"); }); cancelResetBtn.addEventListener("click", () => { resetOverlay.classList.remove("show"); }); confirmResetBtn.addEventListener("click", () => { stageSize = 1; localStorage.setItem("abc-share-plants-visible", "1"); resetBoardState(); }); nextBtn.addEventListener("click", continueAfterBoard); if ("speechSynthesis" in window) { resolveVoice(); window.speechSynthesis.addEventListener("voiceschanged", resolveVoice); } window.addEventListener("resize", sizeBoard); window.addEventListener("orientationchange", () => requestAnimationFrame(sizeBoard)); resetBoardState(); })(); </script> </body> </html>
