<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>משחק חשבון</title>
<style>
:root{--p:#ff7fc8;--v:#a978f4;--t:#5c2d68;--m:#966ca0;--g:#dff7e4;--r:#ffdbe4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:var(--t)}
body{background:linear-gradient(155deg,#ffe4f3,#efe1ff,#fff8fc);overflow:hidden;user-select:none}
.app{min-height:100dvh;display:flex;flex-direction:column;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box,.btn,.animalProgress{background:#ffffffd9;border-radius:18px;padding:8px 10px;box-shadow:0 5px 16px #783e8c1a;text-align:center;font-weight:900}
.btn{border:0;background:linear-gradient(135deg,var(--v),var(--p));color:white;font-size:16px;min-height:44px}
.animalProgress{padding:8px 12px}.apTitle{font-size:14px;color:var(--m);margin-bottom:6px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:#f8efff;border-radius:14px;padding:7px;font-size:18px}.meter.done{background:var(--g)}
.game{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.timer{width:min(92vw,540px);height:18px;background:#ffffffb8;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--v),var(--p));transform-origin:right center}
.eq{width:min(94vw,560px);background:#fff;border-radius:30px;text-align:center;padding:22px 10px;font-size:clamp(52px,14vw,88px);font-weight:900;direction:ltr;box-shadow:0 12px 28px #6f3d8426}
.answers{width:min(94vw,560px);display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{border:0;border-radius:24px;min-height:88px;background:#fff;font-size:clamp(34px,9vw,48px);font-weight:900;color:var(--t);box-shadow:0 7px 18px #783e8c24}
.answer.good{background:var(--g)}.answer.bad{background:var(--r)}
.animalsBox{background:#ffffffb8;border-radius:20px;padding:7px 10px}.animalsTitle{text-align:center;font-size:13px;color:var(--m);font-weight:800}.animals{display:flex;gap:7px;overflow-x:auto;min-height:40px;align-items:center}.animal{font-size:33px}
.overlay{position:fixed;inset:0;display:none;place-items:center;background:#47235361;z-index:20;padding:16px}.overlay.show{display:grid}
.card{width:min(94vw,500px);max-height:88dvh;overflow:auto;background:#fff7fc;border-radius:28px;padding:20px 14px;box-shadow:0 20px 60px #0003}
.title{text-align:center;font-size:28px;font-weight:900}.big{text-align:center;font-size:84px}.sub{text-align:center;color:var(--m);font-size:18px;margin:8px 0}
.close{display:block;margin:16px auto 0;border:0;border-radius:18px;padding:12px 22px;background:#ffe88e;color:var(--t);font-size:20px;font-weight:900}
.statsWrap{margin-top:14px;overflow:auto;border-radius:14px}.stats{width:100%;border-collapse:collapse;background:#fff;text-align:center}.stats th{position:sticky;top:0;background:#f3e7ff;padding:10px 6px}.stats td{padding:9px 6px;border-top:1px solid #f1e6f3;font-weight:800}.stats td:first-child{direction:ltr}
.coin{position:fixed;font-size:40px;pointer-events:none;animation:fly .7s forwards}@keyframes fly{to{transform:translateY(-90px);opacity:0}}
</style>
</head>
<body>
<div class="app">
  <div class="grid"><div class="box">🪙 <span id="coins">0</span></div><div class="box">🏆 <span id="trophies">0</span></div></div>
  <div class="grid"><div class="box">עברו: <span id="progress">0/40</span></div><button class="btn" id="timeMode">⏱ עם זמן</button></div>
  <div class="animalProgress">
    <div class="apTitle">בדרך לחיה הבאה 🐾</div>
    <div class="meters"><div class="meter" id="plusMeter">➕ <span id="plusP">0</span>/3</div><div class="meter" id="minusMeter">➖ <span id="minusP">0</span>/3</div></div>
  </div>
  <div class="grid"><button class="btn" id="openStats">📊 סטטיסטיקות</button><div class="box" id="modeLabel">20 שניות לכל תרגיל</div></div>
  <main class="game"><div class="timer" id="timer"><div class="bar" id="bar"></div></div><div class="eq" id="eq"></div><div class="answers" id="answers"></div></main>
  <div class="animalsBox"><div class="animalsTitle">החיות שאספתי</div><div class="animals" id="animals"><span id="empty">כאן יופיעו החיות שצברת</span></div></div>
</div>
<div class="overlay" id="reward"><div class="card"><div class="big" id="rewardIcon">🌟</div><div class="title" id="rewardTitle">כל הכבוד!</div><div class="sub" id="rewardSub"></div><button class="close" id="nextStage"></button></div></div>
<div class="overlay" id="statsModal"><div class="card"><div class="title">📊 סטטיסטיקות</div><div class="statsWrap"><table class="stats"><thead><tr><th>תרגיל</th><th>נכון</th><th>לא נכון</th><th>זמן</th></tr></thead><tbody id="statsBody"></tbody></table></div><button class="close" id="closeStats">סגור</button></div></div>
<script>
(()=> {
const pool=["🦄","🐶","🐱","🐰","🦊","🐼","🐨","🐯","🦁","🐸","🐵","🐧","🦋","🐢","🦜","🐳","🦒","🐷","🐮","🐥"];
const $=id=>document.getElementById(id), eq=$("eq"),answers=$("answers"),bar=$("bar"),timer=$("timer");
let step=1,coins=0,trophies=0,animals=[],queue=[],current=null,passed=new Set(),locked=false,timed=true,raf=null,start=0;
let plusP=0,minusP=0,totalCorrect=0,totalWrong=0; const LIMIT=20000, stats={};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function key(q){return q.a+" "+q.op+" "+q.step}
function build(s){let a=[];for(let n=0;n<=20-s;n++)a.push({a:n,op:"+",step:s,answer:n+s});for(let n=s;n<=20;n++)a.push({a:n,op:"−",step:s,answer:n-s});return a}
function total(){return 2*(21-step)}
function ensure(q){if(!stats[key(q)])stats[key(q)]={correct:0,wrong:0,lastCorrect:null}}
function fmt(ms){return ms==null?"—":(ms/1000).toFixed(1)+" שניות"}
function updateProgress(){$("progress").textContent=passed.size+"/"+total()}
function startStage(){stopTimer();queue=shuffle(build(step));queue.forEach(ensure);passed=new Set();updateProgress();nextQuestion()}
function nextQuestion(){stopTimer();if(passed.size===total())return finishStage();while(queue.length){let q=queue.shift();if(!passed.has(key(q))){current=q;break}}if(!current||passed.has(key(current))){queue=shuffle(build(step).filter(q=>!passed.has(key(q))));current=queue.shift()}eq.textContent=current.a+" "+current.op+" "+current.step;renderChoices();locked=false;startTimer()}
function startTimer(){stopTimer();start=performance.now();bar.style.transform="scaleX(1)";if(!timed)return;const tick=now=>{let e=now-start,r=Math.max(0,1-e/LIMIT);bar.style.transform="scaleX("+r+")";if(e>=LIMIT)return timeout();raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function stopTimer(){if(raf){cancelAnimationFrame(raf);raf=null}}
function choices(){let d=current.a-current.step,u=current.a+current.step,a=[];if(d>=0&&d<=20)a.push(d);if(u>=0&&u<=20&&!a.includes(u))a.push(u);if(a.length<2){for(let x=0;x<=20&&a.length<2;x++)if(x!==current.answer&&!a.includes(x))a.push(x)}if(!a.includes(current.answer))a[0]=current.answer;return shuffle(a.slice(0,2))}
function renderChoices(){answers.innerHTML="";choices().forEach(v=>{let b=document.createElement("button");b.className="answer";b.textContent=v;b.onclick=e=>choose(v,b,e);answers.appendChild(b)})}
function record(ok){ensure(current);let s=stats[key(current)],elapsed=performance.now()-start;if(ok){s.correct++;s.lastCorrect=elapsed;totalCorrect++}else{s.wrong++;totalWrong++}}
function requeue(){queue.push(current);shuffle(queue)}
function choose(v,b,e){if(locked)return;locked=true;stopTimer();if(v===current.answer){b.classList.add("good");record(true);coins++;$("coins").textContent=coins;coin(e.clientX,e.clientY);passed.add(key(current));updateProgress();animalProgress(true)}else{b.classList.add("bad");record(false);animalProgress(false);requeue()}setTimeout(()=>{current=null;nextQuestion()},420)}
function timeout(){if(locked)return;locked=true;stopTimer();bar.style.transform="scaleX(0)";record(false);animalProgress(false);requeue();setTimeout(()=>{current=null;nextQuestion()},350)}
function animalProgress(ok){let plus=current.op==="+";if(ok){if(plus)plusP=Math.min(3,plusP+1);else minusP=Math.min(3,minusP+1)}else{if(plus)plusP=Math.max(0,plusP-1);else minusP=Math.max(0,minusP-1)}if(plusP===3&&minusP===3){addAnimal();plusP=minusP=0}updateMeters()}
function updateMeters(){$("plusP").textContent=plusP;$("minusP").textContent=minusP;$("plusMeter").classList.toggle("done",plusP===3);$("minusMeter").classList.toggle("done",minusP===3)}
function addAnimal(){let a=pool[Math.floor(Math.random()*pool.length)];animals.push(a);let e=$("empty");if(e)e.remove();let s=document.createElement("span");s.className="animal";s.textContent=a;$("animals").prepend(s)}
function coin(x,y){let c=document.createElement("div");c.className="coin";c.textContent="🪙";c.style.left=(x-20)+"px";c.style.top=(y-20)+"px";document.body.appendChild(c);setTimeout(()=>c.remove(),750)}
function finishStage(){stopTimer();trophies++;$("trophies").textContent=trophies;if(step===1){$("rewardIcon").textContent="🌟";$("rewardSub").textContent=timed?"עברת את כל התרגילים בזמן.":"סיימת את כל התרגילים.";$("nextStage").textContent="לעבור לפלוס ומינוס 2"}else{$("rewardIcon").textContent="🏆";$("rewardSub").textContent="סיימת גם את השלב הזה!";$("nextStage").textContent="לשחק שוב"}$("reward").classList.add("show")}
function renderStats(){let body=$("statsBody");body.innerHTML="";build(step).forEach(q=>{ensure(q);let s=stats[key(q)],tr=document.createElement("tr");tr.innerHTML="<td>"+key(q)+"</td><td>"+s.correct+"</td><td>"+s.wrong+"</td><td>"+fmt(s.lastCorrect)+"</td>";body.appendChild(tr)})}
$("nextStage").onclick=()=>{$("reward").classList.remove("show");if(step===1)step=2;startStage()};
$("timeMode").onclick=()=>{timed=!timed;if(timed){$("timeMode").textContent="⏱ עם זמן";$("modeLabel").textContent="20 שניות לכל תרגיל";timer.style.display="";if(current&&!locked)startTimer()}else{$("timeMode").textContent="♾️ בלי זמן";$("modeLabel").textContent="ללא הגבלת זמן";timer.style.display="none";if(current&&!locked)start=performance.now();stopTimer()}};
$("openStats").onclick=()=>{stopTimer();renderStats();$("statsModal").classList.add("show")};
$("closeStats").onclick=()=>{$("statsModal").classList.remove("show");if(current&&!locked)startTimer()};
$("statsModal").onclick=e=>{if(e.target===$("statsModal")){$("statsModal").classList.remove("show");if(current&&!locked)startTimer()}};
updateMeters();startStage();
})();
</script>
</body>
</html>
